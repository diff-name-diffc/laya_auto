[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liveweb-benchmark"
version = "0.1.0"
description = "Live-web end-to-end capability benchmark for the Laya browser decision model (CloakBrowser + POST /v1/systemone)"
requires-python = ">=3.10"
dependencies = ["cloakbrowser[geoip]>=0.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["agentbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
